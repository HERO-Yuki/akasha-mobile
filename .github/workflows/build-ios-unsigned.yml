# 未署名 iOS IPA を GitHub Actions（無料 macOS ランナー）でビルドする
# main への push・タグ push・手動実行（Actions タブ → Run workflow）で起動。
# 出来上がった Akasha-unsigned.ipa を Artifacts からダウンロードし、
# Windows の Sideloadly + 無料 Apple ID で iPhone にインストールする（7日ごと再署名）。
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Expo SDK 57 は Swift 6.2 (= Xcode 26系) を要求する。
      # expo-modules-jsi は `weak let`（新構文）を使うため古い 26.0.x では通らず、
      # 最新 26.3 では Date.swift の1行だけが型推論エラーになる（後段のパッチで解消）。
      # → 最新の Xcode を選び、問題の1行はパッチする方針。
      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          PICK=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting: $PICK"
          sudo xcode-select -s "$PICK"
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci

      # Xcode 26.3 の Swift で型推論エラーになる1行を等価コードに置換
      # （abs(x) <= y → x.magnitude <= y。どの Swift バージョンでも同じ意味）
      - name: Patch expo-modules-jsi for newest Swift
        run: |
          F=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Coding/JavaScriptCodable+Date.swift
          if [ -f "$F" ]; then
            sed -i '' 's/abs(milliseconds) <= maxJavaScriptDateMilliseconds/milliseconds.magnitude <= maxJavaScriptDateMilliseconds/' "$F"
            grep -n "maxJavaScriptDateMilliseconds" "$F" || true
          else
            echo "patch target not found (version changed?) — skipping"
          fi

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: '1'

      - name: Install CocoaPods
        run: |
          set -o pipefail
          cd ios
          pod install 2>&1 | tee ../pod-install.log
        env:
          LANG: en_US.UTF-8

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Akasha.xcworkspace \
            -scheme Akasha \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -name '*.app' -maxdepth 2 | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr Akasha-unsigned.ipa Payload
          ls -la Akasha-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Akasha-unsigned-ipa
          path: Akasha-unsigned.ipa
          retention-days: 30

      # ---- 失敗時診断: ログ末尾を実行サマリーに出す（ログイン不要で見える） ----
      - name: Failure diagnostics
        if: failure()
        run: |
          {
            echo "## Build failure diagnostics"
            echo ""
            echo "### xcodebuild errors (grep)"
            echo '```'
            grep -E "error:|fatal error:|The following build commands failed" -A 2 xcodebuild.log 2>/dev/null | tail -80 || echo "(no xcodebuild.log)"
            echo '```'
            echo "### xcodebuild.log tail"
            echo '```'
            tail -60 xcodebuild.log 2>/dev/null || echo "(no xcodebuild.log)"
            echo '```'
            echo "### pod-install.log tail"
            echo '```'
            tail -40 pod-install.log 2>/dev/null || echo "(no pod-install.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            pod-install.log
          if-no-files-found: ignore
          retention-days: 7
